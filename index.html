<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Singing Bowl Cat</title>
    <link rel="stylesheet" href="styles.css?v=20260820-clock-3col-no-check" />
  </head>
  <body>
    <main class="app-shell" aria-label="Singing Bowl Cat prototype">
      <section class="phone">
        <div class="screen" data-screen="home">
          <div class="scene scene-room-custom-01" id="homeScene">
            <button class="icon-button settings-button" type="button" data-view="cats" aria-label="꾸미기">⚙</button>
            <img class="room-prop clock-prop wall-clock" id="clockProp" src="assets/props/wall-clock.png?v=20260820-clock-3col-no-check" alt="" aria-hidden="true" />
            <img class="room-prop radio-prop floor-radio" id="radioProp" src="assets/props/radios/placed/radio_02.png?v=20260820-clock-3col-no-check" alt="" aria-hidden="true" />
            <img class="room-prop rug-prop floor-rug" id="floorRug" src="assets/props/floor-rug-02.png?v=20260820-clock-3col-no-check" alt="" aria-hidden="true" />
            <div class="cat-stage">
              <button class="cat-button" id="ringButton" type="button" aria-label="싱잉볼 울리기">
                <img id="catFrame" src="assets/cat-hit/hit_01.png?v=20260820-clock-3col-no-check" alt="고양이가 싱잉볼을 치는 모습" />
                <img id="selectedBowlOverlay" class="selected-bowl-overlay" src="assets/bowls/hand-hammered-tibetan.png?v=20260820-clock-3col-no-check" alt="" aria-hidden="true" />
                <span class="ripple-layer" aria-hidden="true"></span>
                <span class="spark-layer" aria-hidden="true"></span>
              </button>
            </div>
            <nav class="quick-panel" aria-label="빠른 메뉴">
              <button class="quick-card" type="button" data-view="bowls">
                <span class="quick-icon">🥣</span>
                <span>싱잉볼</span>
              </button>
              <button class="quick-card" type="button" data-view="cats">
                <span class="quick-icon">🏪</span>
                <span>꾸미기</span>
              </button>
              <button class="quick-card" type="button" data-view="records">
                <span class="quick-icon">⌗</span>
                <span>기록</span>
              </button>
            </nav>
          </div>
        </div>

        <div class="screen hidden" data-screen="cats">
          <header class="top-bar">
            <button class="back-button" type="button" data-view="home" aria-label="뒤로">‹</button>
            <h1>꾸미기</h1>
            <button class="done-button" type="button" data-view="home">완료</button>
          </header>
          <div class="content decor-content">
            <nav class="decor-tabs" aria-label="꾸미기 카테고리">
              <button class="decor-tab active" type="button" data-decor-tab="rugs" aria-selected="true">
                <span>러그</span>
              </button>
              <button class="decor-tab" type="button" data-decor-tab="clock" aria-selected="false">
                <span>시계</span>
              </button>
              <button class="decor-tab" type="button" data-decor-tab="radios" aria-selected="false">
                <span>라디오</span>
              </button>
              <button class="decor-tab" type="button" data-decor-tab="backgrounds" aria-selected="false">
                <span>배경</span>
              </button>
            </nav>
            <div class="single-shop-grid clock-grid hidden" data-decor-section="clock" aria-label="시계 선택">
              <button class="decor-item clock-card selected" type="button" data-clock="wall-clock" aria-label="시계 1" aria-pressed="true">
                <img src="assets/props/wall-clock.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="decor-item clock-card" type="button" data-clock="clock-01" aria-label="시계 2" aria-pressed="false">
                <img src="assets/props/clocks/clock_01.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="decor-item clock-card" type="button" data-clock="clock-02" aria-label="시계 3" aria-pressed="false">
                <img src="assets/props/clocks/clock_02.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="decor-item clock-card" type="button" data-clock="clock-03" aria-label="시계 4" aria-pressed="false">
                <img src="assets/props/clocks/clock_03.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="decor-item clock-card" type="button" data-clock="clock-04" aria-label="시계 5" aria-pressed="false">
                <img src="assets/props/clocks/clock_04.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="decor-item clock-card" type="button" data-clock="clock-05" aria-label="시계 6" aria-pressed="false">
                <img src="assets/props/clocks/clock_05.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="decor-item clock-card" type="button" data-clock="clock-06" aria-label="시계 7" aria-pressed="false">
                <img src="assets/props/clocks/clock_06.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
            </div>
            <div class="radio-grid hidden" data-decor-section="radios" aria-label="라디오 선택">
              <button class="radio-card selected" type="button" data-radio="radio-01" aria-label="라디오 1" aria-pressed="true">
                <img src="assets/props/radios/placed/radio_02.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="radio-card" type="button" data-radio="radio-02" aria-label="라디오 2" aria-pressed="false">
                <img src="assets/props/radios/placed/radio_01.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="radio-card" type="button" data-radio="radio-03" aria-label="라디오 3" aria-pressed="false">
                <img src="assets/props/radios/placed/radio_03.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="radio-card" type="button" data-radio="radio-04" aria-label="라디오 4" aria-pressed="false">
                <img src="assets/props/radios/placed/radio_04.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="radio-card" type="button" data-radio="radio-05" aria-label="라디오 5" aria-pressed="false">
                <img src="assets/props/radios/placed/radio_05.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="radio-card" type="button" data-radio="radio-06" aria-label="라디오 6" aria-pressed="false">
                <img src="assets/props/radios/placed/radio_06.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="radio-card" type="button" data-radio="radio-07" aria-label="라디오 7" aria-pressed="false">
                <img src="assets/props/radios/placed/radio_07.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="radio-card" type="button" data-radio="radio-08" aria-label="라디오 8" aria-pressed="false">
                <img src="assets/props/radios/placed/radio_08.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="radio-card" type="button" data-radio="radio-09" aria-label="라디오 9" aria-pressed="false">
                <img src="assets/props/radios/placed/radio_09.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="radio-card" type="button" data-radio="radio-10" aria-label="라디오 10" aria-pressed="false">
                <img src="assets/props/radios/placed/radio_10.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
            </div>
            <div class="rug-grid" data-decor-section="rugs" aria-label="러그 선택">
              <button class="rug-card selected" type="button" data-rug="floor-rug-02" aria-label="러그 2" aria-pressed="true">
                <img src="assets/props/floor-rug-02.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="rug-card" type="button" data-rug="floor-rug-03" aria-label="러그 3" aria-pressed="false">
                <img src="assets/props/floor-rug-03.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="rug-card" type="button" data-rug="floor-rug-04" aria-label="러그 4" aria-pressed="false">
                <img src="assets/props/floor-rug-04.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="rug-card" type="button" data-rug="floor-rug-05" aria-label="러그 5" aria-pressed="false">
                <img src="assets/props/floor-rug-05.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="rug-card" type="button" data-rug="floor-rug-06" aria-label="러그 6" aria-pressed="false">
                <img src="assets/props/floor-rug-06.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
              <button class="rug-card" type="button" data-rug="floor-rug-08" aria-label="러그 8" aria-pressed="false">
                <img src="assets/props/floor-rug-08.png?v=20260820-clock-3col-no-check" alt="" />
              </button>
            </div>
            <div class="background-grid hidden" data-decor-section="backgrounds" aria-label="창문 배경 선택">
              <button class="background-card selected" type="button" data-background="room-custom-01" aria-label="방 1">
                <span class="background-preview room-custom-01-preview"></span>
                <b>✓</b>
              </button>
              <button class="background-card" type="button" data-background="room-custom-02" aria-label="방 2">
                <span class="background-preview room-custom-02-preview"></span>
              </button>
              <button class="background-card" type="button" data-background="room-custom-03" aria-label="방 3">
                <span class="background-preview room-custom-03-preview"></span>
              </button>
              <button class="background-card" type="button" data-background="sea" aria-label="바닷가">
                <span class="background-preview sea-preview"></span>
              </button>
              <button class="background-card" type="button" data-background="forest" aria-label="숲길">
                <span class="background-preview forest-preview"></span>
              </button>
            </div>
          </div>
        </div>

        <div class="screen hidden" data-screen="bowls">
          <header class="top-bar">
            <button class="back-button" type="button" data-view="home" aria-label="뒤로">‹</button>
            <h1>싱잉볼 선택</h1>
          </header>
          <div class="content bowl-list">
            <button class="bowl-row selected" type="button" data-bowl="hand-hammered">
              <img class="bowl-thumb" src="assets/bowls/hand-hammered-tibetan.png?v=20260820-clock-3col-no-check" alt="" />
              <span>
                <strong>티베탄 싱잉볼</strong>
                <em>사용 중</em>
                <small>맑고 긴 울림</small>
              </span>
              <b>✓</b>
            </button>
            <button class="bowl-row" type="button" data-bowl="polished-brass">
              <img class="bowl-thumb" src="assets/bowls/polished-brass.png?v=20260820-clock-3col-no-check" alt="" />
              <span>
                <strong>브라스 싱잉볼</strong>
                <small>부드럽고 따뜻한 울림</small>
              </span>
              <b></b>
            </button>
            <button class="bowl-row" type="button" data-bowl="etched-tibetan">
              <img class="bowl-thumb" src="assets/bowls/etched-tibetan.png?v=20260820-clock-3col-no-check" alt="" />
              <span>
                <strong>에칭 싱잉볼</strong>
                <small>깊고 안정적인 울림</small>
              </span>
              <b></b>
            </button>
            <button class="bowl-row" type="button" data-bowl="crystal-quartz">
              <img class="bowl-thumb" src="assets/bowls/crystal-quartz.png?v=20260820-clock-3col-no-check" alt="" />
              <span>
                <strong>크리스탈 싱잉볼</strong>
                <small>맑고 투명한 울림</small>
              </span>
              <b></b>
            </button>
            <button class="bowl-row" type="button" data-bowl="full-moon">
              <img class="bowl-thumb" src="assets/bowls/full-moon.png?v=20260820-clock-3col-no-check" alt="" />
              <span>
                <strong>풀문 싱잉볼</strong>
                <small>넓고 부드러운 울림</small>
              </span>
              <b></b>
            </button>
            <button class="bowl-row" type="button" data-bowl="antique-jambati">
              <img class="bowl-thumb" src="assets/bowls/antique-jambati.png?v=20260820-clock-3col-no-check" alt="" />
              <span>
                <strong>앤틱 잠바티</strong>
                <small>묵직하고 깊은 울림</small>
              </span>
              <b></b>
            </button>
            <aside class="progress-card">
              <div>
                <strong>싱잉볼 컬렉션</strong>
                <span>6 / 6</span>
              </div>
              <progress value="6" max="6"></progress>
            </aside>
          </div>
        </div>

        <div class="screen hidden" data-screen="records">
          <header class="top-bar">
            <button class="back-button" type="button" data-view="home" aria-label="뒤로">‹</button>
            <h1>기록</h1>
          </header>
          <div class="content records-view">
            <div class="stat-grid">
              <article>
                <span>오늘</span>
                <strong id="recordToday">0</strong>
                <small>회</small>
              </article>
              <article>
                <span>전체 누적</span>
                <strong id="recordTotal">0</strong>
                <small>회</small>
              </article>
              <article>
                <span>연속 기록</span>
                <strong id="streakCount">1</strong>
                <small>일</small>
              </article>
            </div>
            <h2>최근 기록</h2>
            <ul class="record-list" id="recordList"></ul>
            <h2>주간 기록</h2>
            <div class="week-chart" id="weekChart" aria-label="주간 기록 그래프"></div>
          </div>
          <nav class="tab-bar" aria-label="하단 탭">
            <button type="button" data-view="home">⌂<span>홈</span></button>
            <button type="button" data-view="bowls">🥣<span>싱잉볼</span></button>
            <button type="button" data-view="cats">🏪<span>꾸미기</span></button>
            <button class="active" type="button" data-view="records">⌗<span>기록</span></button>
          </nav>
        </div>
      </section>
    </main>
    <script src="app.js?v=20260820-clock-3col-no-check"></script>
  </body>
</html>
