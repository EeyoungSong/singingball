<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>삼색 고양이 · 에셋 미리보기</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 20px 60px; background: #faf7f2; color: #443b35; font-family: system-ui, sans-serif; }
    main { max-width: 1000px; margin: auto; }
    h1 { margin-bottom: 8px; font-size: 28px; }
    p { color: #75685e; line-height: 1.6; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 24px 0; }
    button, select { font: inherit; padding: 10px 16px; border: 1px solid #d8c9bb; border-radius: 12px; color: inherit; background: white; cursor: pointer; }
    button:focus-visible, select:focus-visible { outline: 3px solid #c47f39; outline-offset: 3px; }
    .players { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
    .card { padding: 16px; border: 1px solid #e4d8cc; border-radius: 20px; background: #fff; overflow: hidden; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    .stage { position: relative; overflow: hidden; border-radius: 12px; aspect-ratio: 1; background: var(--surface, #e9dcc8); }
    body[data-bg="checker"] .stage { background: conic-gradient(#eee 25%, #fff 0 50%, #eee 0 75%, #fff 0) 0 0 / 20px 20px; }
    .stage img { display: block; position: absolute; width: 100%; height: auto; }
    .stage.walk img { width: 106%; left: -3%; top: -95%; }
    .label { display: block; text-align: center; margin-top: 10px; color: #75685e; font-size: 13px; }
    .frames { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-top: 16px; }
    .frames a { display: block; text-decoration: none; color: inherit; border-radius: 12px; padding: 8px; border: 1px solid #e4d8cc; background: white; }
    .section-title { margin-top: 36px; }
    #status { min-height: 24px; }
    @media(max-width:640px) { .players { grid-template-columns: 1fr; } .players .stage { max-width: 320px; margin: auto; } .frames { grid-template-columns: repeat(2,1fr); } }
  </style>
</head>
<body>
<main>
  <h1>삼색 고양이 🐈</h1>
  <p>주황색 귀, 차콜색 얼룩, 하얀 발. 싱잉볼 연주와 산책 동작을 확인해 보세요.</p>
  <div class="controls">
    <button id="toggle" type="button" disabled>재생 준비 중</button>
    <label>배경 <select id="background"><option value="sand">따뜻한 베이지</option><option value="green">연한 초록</option><option value="dark">어두운 배경</option><option value="checker">투명 격자</option></select></label>
  </div>
  <p id="status" role="status">이미지를 불러오고 있어요.</p>
  <div class="players">
    <section class="card"><h2>싱잉볼 연주</h2><div class="stage"><img id="hit" src="hit/hit_01.png" alt="싱잉볼을 연주하는 삼색 고양이"></div><span class="label" id="hit-label">1 / 9</span></section>
    <section class="card"><h2>걷기</h2><div class="stage walk"><img id="walk" src="walk/walk-a.png" alt="걷는 삼색 고양이"></div><span class="label">두 발걸음 반복</span></section>
    <section class="card"><h2>서 있기</h2><div class="stage walk"><img src="walk/stand.png" alt="서 있는 삼색 고양이"></div><span class="label">기본 자세</span></section>
  </div>
  <h2 class="section-title">전체 12장</h2>
  <p>각 이미지를 누르면 원본 PNG가 열려요.</p>
  <div class="frames" id="frames"></div>
</main>
<script>
  const hits = Array.from({length:9}, (_,i) => `hit/hit_${String(i+1).padStart(2,'0')}.png`);
  const walks = ['walk/walk-a.png','walk/walk-b.png'];
  const all = [...hits,...walks,'walk/stand.png'];
  const grid = document.querySelector('#frames');
  for (const src of all) {
    const link = document.createElement('a'); link.href = src; link.target = '_blank'; link.rel = 'noopener';
    const stage = document.createElement('div'); stage.className = src.startsWith('walk/') ? 'stage walk' : 'stage';
    const img = document.createElement('img'); img.src = src; img.alt = src;
    const label = document.createElement('span'); label.className = 'label'; label.textContent = src.split('/').pop();
    stage.append(img); link.append(stage,label); grid.append(link);
  }
  document.querySelector('#background').addEventListener('change', event => {
    document.body.dataset.bg = event.target.value;
    document.body.style.setProperty('--surface', {sand:'#e9dcc8',green:'#c9dcc5',dark:'#343a3b',checker:'#fff'}[event.target.value]);
  });
  const button = document.querySelector('#toggle');
  const status = document.querySelector('#status');
  let running = false, elapsed = 0, previous = null, request = null, lastHit = -1, lastWalk = -1;
  function tick(now) {
    if (!running) return;
    if (previous !== null) elapsed += Math.min(now-previous,100);
    previous = now;
    const hitIndex = Math.min(8, Math.floor((elapsed % 1700)/85));
    const walkIndex = Math.floor(elapsed/180) % 2;
    if (lastHit !== hitIndex) { document.querySelector('#hit').src = hits[hitIndex]; document.querySelector('#hit-label').textContent = `${hitIndex+1} / 9`; lastHit = hitIndex; }
    if (lastWalk !== walkIndex) { document.querySelector('#walk').src = walks[walkIndex]; lastWalk = walkIndex; }
    request = requestAnimationFrame(tick);
  }
  button.addEventListener('click', () => {
    running = !running; previous = null; button.textContent = running ? '일시정지' : '재생';
    if (running) request = requestAnimationFrame(tick); else cancelAnimationFrame(request);
  });
  Promise.all(all.map(src => new Promise((resolve,reject) => { const img = new Image(); img.onload = resolve; img.onerror = () => reject(new Error(src)); img.src = src; })))
    .then(() => { button.disabled = false; button.textContent = '재생'; status.textContent = '12장 준비 완료 · 배경을 바꿔 투명 영역도 확인할 수 있어요.'; if (!matchMedia('(prefers-reduced-motion: reduce)').matches) button.click(); })
    .catch(error => { status.textContent = `이미지를 불러오지 못했어요: ${error.message}. 폴더 전체를 함께 보관해 주세요.`; });
</script>
</body>
</html>
